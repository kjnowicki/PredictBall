name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read


jobs:
  deploy-ui:
    name: Deploy UI (FTP)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ui/predictball

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ui/predictball/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Create environment files
        run: node -e "const fs = require('fs'); ['environment.ts', 'environment.development.ts'].forEach(f => { const target = 'src/environments/' + f; if (!fs.existsSync(target)) fs.copyFileSync(target + '.example', target); });"

      - name: Build UI (Production)
        run: npx ng build --configuration production

      - name: Sync UI via LFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            mirror --reverse --delete --verbose dist/predictball/browser/ $FTP_SERVER_DIR;
          "

  deploy-backend:
    name: Deploy Backend (Hetzner SSH)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: api/go.sum

      - name: Build backend for Linux
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o backend-linux main.go

      - name: Copy & Deploy Backend via SCP/SSH
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USERNAME: ${{ secrets.HETZNER_USERNAME }}
          HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "$HETZNER_PASSWORD" scp -o StrictHostKeyChecking=no backend-linux $HETZNER_USERNAME@$HETZNER_HOST:/root/backend-linux
          sshpass -p "$HETZNER_PASSWORD" ssh -o StrictHostKeyChecking=no $HETZNER_USERNAME@$HETZNER_HOST "chmod +x /root/backend-linux && systemctl restart predictball"
