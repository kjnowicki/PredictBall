name: Deploy

on:
  push:
    branches:
      - main
      - workflow-cd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-ui:
    name: Deploy UI (FTP)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ui/predictball

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ui/predictball/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Create environment files
        run: node -e "const fs = require('fs'); ['environment.ts', 'environment.development.ts'].forEach(f => { const target = 'src/environments/' + f; if (!fs.existsSync(target)) fs.copyFileSync(target + '.example', target); });"

      - name: Build UI (Production)
        run: npx ng build --configuration production

      - name: Sync UI via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: powershell
        run: |
          $ftpServer = $env:FTP_SERVER
          $username = $env:FTP_USERNAME
          $password = $env:FTP_PASSWORD
          $remoteDir = $env:FTP_SERVER_DIR
          $localDir = "dist/predictball/browser"

          Get-ChildItem -Path $localDir -Recurse -File | ForEach-Object {
              $relativePath = $_.FullName.Substring((Get-Item $localDir).FullName.Length + 1).Replace('\', '/')
              $targetUrl = "ftp://$ftpServer/$remoteDir/$relativePath"
              curl.exe -u "$($username):$($password)" --ftp-create-dirs -T $_.FullName $targetUrl
          }

  deploy-backend:
    name: Deploy Backend (Hetzner SSH)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: api/go.sum

      - name: Build backend for Linux
        shell: powershell
        run: |
          $env:GOOS="linux"
          $env:GOARCH="amd64"
          $env:CGO_ENABLED="0"
          go build -o backend-linux main.go

      - name: Copy & Deploy Backend to Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USERNAME: ${{ secrets.HETZNER_USERNAME }}
          HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
        shell: powershell
        run: |
          curl.exe -u "$($env:HETZNER_USERNAME):$($env:HETZNER_PASSWORD)" -T backend-linux "sftp://$($env:HETZNER_HOST)/root/backend-linux" --insecure
          npm install ssh2 --no-save
          node -e "
          const { Client } = require('ssh2');
          const conn = new Client();
          conn.on('ready', () => {
            conn.exec('chmod +x /root/backend-linux && systemctl restart predictball', (err, stream) => {
              if (err) throw err;
              stream.on('close', (code) => {
                console.log('Service restarted successfully.');
                conn.end();
                process.exit(code || 0);
              }).on('data', data => process.stdout.write(data)).stderr.on('data', data => process.stderr.write(data));
            });
          }).connect({
            host: process.env.HETZNER_HOST,
            username: process.env.HETZNER_USERNAME,
            password: process.env.HETZNER_PASSWORD
          });
          "
