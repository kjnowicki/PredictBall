name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  api:
    name: API (Go)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: api/go.sum

      - name: Install Go dependencies
        run: go mod download

      - name: Build API
        run: go build -v ./...

      - name: Run API unit tests
        run: go test -v ./...

  ui:
    name: UI (Angular)
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ui/predictball

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/predictball/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build UI
        run: npm run build

      - name: Run UI unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless
