<h2 mat-dialog-title>Select Scorer</h2>

<mat-dialog-content>
  @if (loading) {
    <div style="display: flex; justify-content: center; padding: 2rem;">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  } @else {
    <div class="tables-container">
      <!-- Home Team -->
      <div class="team-column">
        <h3 class="team-title">{{ data.homeTeam?.name || 'Home Team' }}</h3>
        <table mat-table [dataSource]="homePlayers" class="mat-elevation-z2">
          <ng-container matColumnDef="position"><th mat-header-cell *matHeaderCellDef>Pos</th><td mat-cell *matCellDef="let p">{{ p.position }}</td></ng-container>
          <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Name</th><td mat-cell *matCellDef="let p">{{ p.name }}</td></ng-container>
          <ng-container matColumnDef="minutesPlayed"><th mat-header-cell *matHeaderCellDef>Mins</th><td mat-cell *matCellDef="let p" class="center-text">{{ p.minutesPlayed }}</td></ng-container>
          <ng-container matColumnDef="goals"><th mat-header-cell *matHeaderCellDef>Goals</th><td mat-cell *matCellDef="let p" class="center-text">{{ p.goals }}</td></ng-container>
          
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectPlayer(row)" class="player-row"></tr>
        </table>
      </div>

      <!-- Away Team -->
      <div class="team-column">
        <h3 class="team-title">{{ data.awayTeam?.name || 'Away Team' }}</h3>
        <table mat-table [dataSource]="awayPlayers" class="mat-elevation-z2">
          <ng-container matColumnDef="position"><th mat-header-cell *matHeaderCellDef>Pos</th><td mat-cell *matCellDef="let p">{{ p.position }}</td></ng-container>
          <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Name</th><td mat-cell *matCellDef="let p">{{ p.name }}</td></ng-container>
          <ng-container matColumnDef="minutesPlayed"><th mat-header-cell *matHeaderCellDef>Mins</th><td mat-cell *matCellDef="let p" class="center-text">{{ p.minutesPlayed }}</td></ng-container>
          <ng-container matColumnDef="goals"><th mat-header-cell *matHeaderCellDef>Goals</th><td mat-cell *matCellDef="let p" class="center-text">{{ p.goals }}</td></ng-container>
          
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectPlayer(row)" class="player-row"></tr>
        </table>
      </div>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button color="warn" (click)="selectPlayer({id: 0, name: '', position: '', minutesPlayed: 0, goals: 0})">None</button>
</mat-dialog-actions>
